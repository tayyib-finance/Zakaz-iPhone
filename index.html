<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Заказ iPhone и Сравнение</title>
<style>
  :root {
    --bg-main: #0f111a; --bg-card: #1a1d2d; --text-main: #ffffff;
    --text-muted: #8b92a5; --accent: #e11d48; --green: #10b981;
    --btn-blue: #3b82f6; --yellow: #eab308; --border: #2a2e42;
  }
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: var(--bg-main); color: var(--text-main); margin: 0; padding: 16px; padding-bottom: 40px; }
  
  .container { max-width: 600px; margin: 0 auto; }
  h2 { font-size: 18px; margin-bottom: 12px; color: #f5c76a; }

  .supplier-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  .supplier-title { font-size: 13px; font-weight: 700; color: var(--yellow); margin-bottom: 8px; }
  .supplier-title.main { color: #a3e635; }
  .supplier-box textarea { width: 100%; height: 120px; background: #0f111a; border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 8px; font-size: 12px; resize: vertical; outline: none; line-height: 1.4;}
  
  .btn { padding: 12px; border-radius: 8px; border: none; font-weight: 700; font-size: 14px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 6px; text-align: center; width: 100%;}
  .btn-compare { background: #a3e635; color: #000; margin: 15px 0; }

  .result-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .result-title { font-size: 14px; font-weight: 700; color: #f5c76a; margin-bottom: 8px; }
  .prices-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .price-box { border-radius: 6px; padding: 6px 2px; text-align: center; display: flex; flex-direction: column; justify-content: center; }
  .price-box .label { font-size: 9px; opacity: 0.8; margin-bottom: 2px; }
  .price-box .val { font-size: 11px; font-weight: 700; }
  
  .bg-green { background: rgba(16, 185, 129, 0.2); border: 1px solid rgba(16, 185, 129, 0.5); color: #4ade80; }
  .bg-red { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); color: #f87171; }
  .bg-gray { background: #1f2937; border: 1px solid #374151; color: #9ca3af; }
</style>
</head>
<body>

<div class="container">
  
  <h2>1. Сравнение цен (Ахмед - основа)</h2>
  <div class="supplier-box">
    <div class="supplier-title main">⭐ Поставщик 1 (Ахмед)</div>
    <textarea id="supplier1" placeholder="Вставьте прайс Ахмеда..."></textarea>
  </div>
  <div class="supplier-box">
    <div class="supplier-title">🏪 Поставщик 2</div>
    <textarea id="supplier2" placeholder="Вставьте прайс..."></textarea>
  </div>
  <div class="supplier-box">
    <div class="supplier-title">🏪 Поставщик 3 (Дубай, AED)</div>
    <textarea id="supplier3" placeholder="Вставьте прайс..."></textarea>
  </div>
  <div class="supplier-box">
    <div class="supplier-title">🇦🇪 Поставщик 4 (Австралия, AED)</div>
    <textarea id="supplier4" placeholder="Вставьте прайс..."></textarea>
  </div>

  <button class="btn btn-compare" onclick="comparePrices()">Сравнить цены</button>
  <div id="results"></div>

</div>

<script>
  // Ультра-парсер (понимает скобки)
  function parseSupplierText(text, isDubai = false) {
    let result = []; 
    if(!text) return result;

    let currentModel = "";
    let currentStorage = "";
    
    const lines = text.split('\n');
    lines.forEach(rawLine => {
      let line = rawLine.trim(); 
      if (!line) return;

      // Проверяем, есть ли цена в строке (от 4 до 7 цифр в конце)
      const priceMatch = line.match(/(\d{4,7})$/);
      
      // Ищем модель (iPhone 18, 18 Pro, 18 Pro Max)
      const modelMatch = line.match(/(?:iPhone\s*)?(1[5-8]|11|12|13|14)(?:\s*(?:Pro|про))?(?:\s*(?:Max|Макс))?/i);
      
      // Ищем память (256, 512, 1TB, 2TB)
      const storageMatch = line.match(/\b(64|128|256|512|1024|1TB|2TB)\b/i);

      // Ищем SIM (eSim или 1Sim+eSim)
      let simType = "";
      if (line.toLowerCase().includes('esim') || line.toLowerCase().includes('e-sim')) simType = "eSim";
      if (line.toLowerCase().includes('1sim') || line.toLowerCase().includes('1-sim')) simType = "1Sim+eSim";

      // Если нашли модель и память, обновляем текущую модель
      if (modelMatch && storageMatch) {
         let baseNum = modelMatch[1];
         let isMax = line.toLowerCase().includes('max') || line.toLowerCase().includes('макс');
         let isPro = line.toLowerCase().includes('pro') || line.toLowerCase().includes('про');

         currentModel = `iPhone ${baseNum}`;
         if (isPro) currentModel += ' Pro';
         if (isMax) currentModel += ' Max';
         
         let st = storageMatch[1].toUpperCase();
         if (st === '1024') st = '1TB';
         if (st === '2048') st = '2TB';
         if (st === '64') st = '64GB';
         if (st === '128') st = '128GB';
         if (st === '256') st = '256GB';
         if (st === '512') st = '512GB';
         currentStorage = st;
         
         // Если в этой же строке есть цена (как у Ахмеда)
         if (priceMatch) {
            const price = Number(priceMatch[1]);
            let colorStr = line.replace(priceMatch[0], '').replace(/\(.*?\)/g, '').replace(modelMatch[0], '').replace(storageMatch[0], '').replace(/[-—@]/g, '').replace(/GB/gi, '').replace(/TB/gi, '').trim();
            if (!colorStr) colorStr = "Standard";
            
            let key = `${currentModel} ${currentStorage} ${colorStr} ${simType}`.trim();
            result.push({ key: key, price: price });
         }
         return; 
      }

      // Если модель уже есть, но цена на новой строке (как у Дубая)
      if (currentModel && currentStorage && priceMatch) {
         const price = Number(priceMatch[1]);
         let colorStr = line.replace(priceMatch[0], '').replace(/[-—@]/g, '').replace(/GB/gi, '').replace(/TB/gi, '').trim();
         
         // Игнорируем мусор
         if (colorStr.toLowerCase().includes('гарант') || colorStr.toLowerCase().includes('адрес') || colorStr.toLowerCase().includes('номер') || colorStr.toLowerCase().includes('мест')) return;
         
         if (!colorStr) colorStr = "Standard";
         if (colorStr.toLowerCase().includes('burg')) colorStr = "Burgundy";
         if (colorStr.toLowerCase().includes('glac')) colorStr = "Glacier";
         
         let key = `${currentModel} ${currentStorage} ${colorStr} ${simType}`.trim();
         result.push({ key: key, price: price });
      }
    });
    return result;
  }

  window.comparePrices = function() {
    document.getElementById('results').innerHTML = '';

    const list1 = parseSupplierText(document.getElementById('supplier1').value, false);
    const list2 = parseSupplierText(document.getElementById('supplier2').value, false);
    const list3 = parseSupplierText(document.getElementById('supplier3').value, true);
    const list4 = parseSupplierText(document.getElementById('supplier4').value, true);

    let dict2 = {}; list2.forEach(i => dict2[i.key] = i.price);
    let dict3 = {}; list3.forEach(i => dict3[i.key] = i.price);
    let dict4 = {}; list4.forEach(i => dict4[i.key] = i.price);

    let resultsHtml = '';

    if (list1.length === 0) {
        document.getElementById('results').innerHTML = '<div style="text-align:center; padding:20px; color:#f87171;">Не удалось распознать текст Ахмеда. Убедитесь, что есть цена в конце строки.</div>';
        return;
    }

    list1.forEach(item => {
      const key = item.key; 
      const price1 = item.price;
      const price2 = dict2[key] || null; 
      const price3 = dict3[key] || null; 
      const price4 = dict4[key] || null;

      let minPrice = Math.min(price1 || Infinity, price2 || Infinity, price3 || Infinity, price4 || Infinity);
      
      // Форматируем название для вывода
      let displayName = key.replace(' eSim', ' (eSim)').replace(' 1Sim+eSim', ' (1Sim+eSim)');
      
      resultsHtml += `
        <div class="result-card">
          <div class="result-title">${displayName}</div>
          <div class="prices-grid">
            <div class="price-box ${price1 === minPrice ? 'bg-green' : 'bg-red'}">
              <span class="label">АХМЕД</span>
              <span class="val">${price1.toLocaleString('ru-RU')} ₽</span>
            </div>
            <div class="price-box ${price2 === minPrice ? 'bg-green' : (price2 ? 'bg-red' : 'bg-gray')}">
              <span class="label">ПОСТ 2</span>
              <span class="val">${price2 ? price2.toLocaleString('ru-RU') + ' ₽' : '-'}</span>
            </div>
            <div class="price-box ${price3 === minPrice ? 'bg-green' : (price3 ? 'bg-red' : 'bg-gray')}">
              <span class="label">ПОСТ 3</span>
              <span class="val">${price3 ? price3.toLocaleString('ru-RU') + ' AED' : '-'}</span>
            </div>
            <div class="price-box ${price4 === minPrice ? 'bg-green' : (price4 ? 'bg-red' : 'bg-gray')}">
              <span class="label">ПОСТ 4</span>
              <span class="val">${price4 ? price4.toLocaleString('ru-RU') + ' AED' : '-'}</span>
            </div>
          </div>
        </div>`;
    });

    document.getElementById('results').innerHTML = resultsHtml;
  }
</script>
</body>
</html>
