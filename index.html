<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Генератор витрины</title>
<style>
  :root {
    --bg-main: #0f111a;
    --bg-card: #1a1d2d;
    --text-main: #ffffff;
    --text-muted: #8b92a5;
    --green: #4ade80;
    --red: #ef4444;
    --blue: #3b82f6;
    --border: #2a2e42;
  }
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: var(--bg-main); color: var(--text-main); margin: 0; padding: 16px; padding-bottom: 40px; }
  
  .container { max-width: 600px; margin: 0 auto; }

  /* Блок ввода */
  .input-box { background: var(--bg-card); border-radius: 16px; padding: 16px; margin-bottom: 20px; border: 1px solid var(--border); }
  textarea { width: 100%; height: 120px; background: #0f111a; border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 8px; font-size: 14px; resize: vertical; outline: none; margin-bottom: 12px; font-family: monospace; line-height: 1.5;}
  textarea::placeholder { color: #64748b; }
  
  .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .btn { padding: 12px; border-radius: 8px; border: none; font-weight: 700; font-size: 14px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 6px; text-align: center; transition: 0.2s;}
  
  .btn-calc { background: var(--green); color: #000; }
  .btn-clear { background: #334155; color: #fff; }
  .btn-download { background: #e11d48; color: #fff; }
  .btn-wa { background: var(--blue); color: #fff; }

  /* Таблица редактирования */
  .edit-section { background: var(--bg-card); border-radius: 12px; padding: 12px; margin-bottom: 20px; display: none; border: 1px solid var(--border); }
  .edit-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #334155; gap: 10px;}
  .edit-row:last-child { border-bottom: none; }
  .edit-name { font-size: 13px; font-weight: 600; flex: 1; line-height: 1.3;}
  .edit-price-input { width: 100px; background: #0f111a; border: 1px solid #475569; color: var(--green); padding: 6px; border-radius: 6px; font-size: 14px; font-weight: 700; text-align: right; outline: none;}

  /* Витрина */
  .preview-container { background: #000; border-radius: 24px; padding: 2px; border: 1px solid #333; margin-bottom: 20px; overflow: hidden;}
  .poster { padding: 30px 20px; text-align: center; border-radius: 22px; background: radial-gradient(circle at top, #1a0e12 0%, #050508 60%); }
  
  .poster-header-text { text-align: center; margin-bottom: 20px; font-size: 13px; color: #f5c76a; font-weight: 700; line-height: 1.4;}
  
  .poster-list { display: flex; flex-direction: column; gap: 10px; }
  .poster-item { border-radius: 14px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; text-align: left; gap: 10px; background: rgba(30, 20, 20, 0.5); border: 1px solid rgba(255,255,255,0.05); }
  .p-name { font-size: 15px; font-weight: 700; color: #fff; line-height: 1.3; flex: 1;}
  .p-price { font-size: 18px; font-weight: 800; white-space: nowrap; color: var(--green);}
  
  .poster-footer { margin-top: 25px; border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 8px; text-align: center; border: 1px solid #3f2e14; background: rgba(63, 46, 20, 0.2); }
  .footer-title { font-size: 14px; font-weight: 800; color: #f5c76a; }
  .footer-sub { font-size: 12px; color: #aaa;}
  .footer-phone { margin-top: 10px; padding-top: 12px; border-top: 1px dashed #5a4020; font-size: 18px; font-weight: 800; letter-spacing: 1px; color: var(--green); }
  .empty-text { font-size: 13px; color: #64748b; margin: 30px 0;}
</style>
</head>
<body>

<div class="container">
  
  <div class="input-box">
    <textarea id="textInput" placeholder="Вставьте список сюда..."></textarea>
    
    <div class="btn-grid">
      <button class="btn btn-calc" onclick="processText()">Рассчитать</button>
      <button class="btn btn-clear" onclick="clearAll()">Очистить</button>
    </div>
    <div class="btn-grid">
      <button class="btn btn-download" onclick="downloadImage()">📥 Скачать картинку</button>
      <button class="btn btn-wa" onclick="copyText()">📱 Текст в WhatsApp</button>
    </div>
  </div>

  <div class="edit-section" id="editSection">
    <div style="font-size: 12px; color: #aaa; margin-bottom: 10px;">Проверьте и измените цены:</div>
    <div id="editList"></div>
  </div>

  <div class="preview-container" id="posterContainer">
    <div class="poster">
      <div class="poster-header-text">
        ПРЕДЗАКАЗ ДО 17:00<br>ВЫДАЧА НА СУББОТУ
      </div>
      
      <div class="poster-list" id="posterList">
         <div class="empty-text">Вставьте текст и нажмите "Рассчитать"</div>
      </div>
      
      <div class="poster-footer">
        <div class="footer-title">💳 Доступна рассрочка</div>
        <div class="footer-sub">Без банков и переплат</div>
        <div class="footer-title" style="margin-top: 8px;">🔥 Предзаказ ВЫГОДНЕЕ!</div>
        <div class="footer-sub">Аванс всего 3000 ₽. Экономьте!</div>
        <div style="font-size: 12px; color: #aaa; margin-top: 15px;">Заказ по телефону / WhatsApp:</div>
        <div class="footer-phone">+7 988 783-66-77</div>
      </div>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
  let items = [];

  // Функция для замены слов цветов на эмодзи
  function getColorEmoji(str) {
    let res = str;
    if (res.toLowerCase().includes('black')) res = res.replace(/black/gi, '⚫');
    if (res.toLowerCase().includes('silver')) res = res.replace(/silver/gi, '⚪');
    if (res.toLowerCase().includes('blue')) res = res.replace(/blue/gi, '🔵');
    if (res.toLowerCase().includes('burgundy') || res.toLowerCase().includes('burgun')) res = res.replace(/burgundy|burgun/gi, '🔴');
    if (res.toLowerCase().includes('glacier') || res.toLowerCase().includes('glac')) res = res.replace(/glacier|glac/gi, '🧊');
    if (res.toLowerCase().includes('titanium')) res = res.replace(/titanium/gi, '🟡');
    return res;
  }

  function processText() {
    const text = document.getElementById('textInput').value;
    if(!text.trim()) return alert('Вставьте текст');

    const lines = text.split('\n').filter(l => l.trim() !== '');
    items = [];

    lines.forEach(line => {
      // Ищем цену (от 4 до 7 цифр)
      const priceMatch = line.match(/\b(\d{4,7})\b/);
      if (!priceMatch) return;

      const price = Number(priceMatch[1]);
      let namePart = line.replace(priceMatch[0], '').replace(/[-—@]/g, '').trim();

      // Убираем слово "iPhone"
      namePart = namePart.replace(/iPhone/gi, '').trim();

      // Меняем цвета на эмодзи
      namePart = getColorEmoji(namePart);

      // Убираем скобки, но оставляем текст внутри (чтобы были видны ГБ и eSim)
      namePart = namePart.replace(/[()]/g, '').replace(/\s+/g, ' ');

      if (namePart) {
        items.push({ name: namePart, price: price });
      }
    });

    if (items.length === 0) return alert('Не найдено ни одной цены.');

    renderEditTable();
    renderPoster();
  }

  function renderEditTable() {
    const wrap = document.getElementById('editList');
    wrap.innerHTML = '';

    items.forEach((item, index) => {
      const row = document.createElement('div');
      row.className = 'edit-row';
      row.innerHTML = `
        <div class="edit-name">${item.name}</div>
        <input type="number" class="edit-price-input" value="${item.price}" oninput="updatePrice(${index}, this.value)">
      `;
      wrap.appendChild(row);
    });

    document.getElementById('editSection').style.display = 'block';
  }

  window.updatePrice = function(index, newPrice) {
    items[index].price = Number(newPrice) || 0;
    renderPoster(); 
  }

  function renderPoster() {
    const listWrap = document.getElementById('posterList');
    if (items.length === 0) return;

    let html = '';
    items.forEach(item => {
      // Для картинки можно делать шрифт чуть меньше, если название длинное
      const fontSize = item.name.length > 25 ? '13px' : '15px';
      html += `
        <div class="poster-item">
          <div class="p-name" style="font-size: ${fontSize};">${item.name}</div>
          <div class="p-price">${item.price.toLocaleString('ru-RU')} ₽</div>
        </div>
      `;
    });
    listWrap.innerHTML = html;
  }

  window.clearAll = function() {
    document.getElementById('textInput').value = '';
    document.getElementById('posterList').innerHTML = '<div class="empty-text">Вставьте текст и нажмите "Рассчитать"</div>';
    document.getElementById('editSection').style.display = 'none';
    items = [];
  }

  window.downloadImage = function() {
    if (items.length === 0) return alert('Сначала нажмите "Рассчитать"');
    
    const posterElement = document.getElementById('posterContainer');
    html2canvas(posterElement, { scale: 2, backgroundColor: '#0f111a', useCORS: true }).then(canvas => {
      const imgData = canvas.toDataURL('image/png');
      if (navigator.userAgent.match(/iPhone|iPad|iPod/i)) { 
         const win = window.open(); 
         win.document.write('<img src="' + imgData + '" style="width:100%;" />'); 
      } else { 
         const link = document.createElement('a'); link.download = `vizitka.png`; link.href = imgData; link.click(); 
      }
    });
  }

  window.copyText = function() {
    if (items.length === 0) return alert('Сначала нажмите "Рассчитать"');

    // Формируем красивый текст для WhatsApp (без слова iPhone, с эмодзи)
    let text = "🔥 *В НАЛИЧИИ*\n\n";
    items.forEach(item => {
      text += `▪️ ${item.name}\n   Цена: *${item.price.toLocaleString('ru-RU')} ₽*\n\n`;
    });
    text += "💳 Доступна рассрочка\n🔥 Предзаказ ВЫГОДНЕЕ (аванс 3000 ₽)\n\n📞 Заказ: +7 988 783-66-77";
    
    navigator.clipboard.writeText(text).then(() => { 
      alert("Текст скопирован! Вставьте его в WhatsApp."); 
    });
  }
</script>
</body>
</html>
