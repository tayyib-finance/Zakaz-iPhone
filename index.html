<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Генератор витрины</title>
<style>
  :root {
    --bg-main: #0f111a;
    --bg-card: #1a1d2d;
    --text-main: #ffffff;
    --text-muted: #8b92a5;
    --green: #4ade80;
    --red: #ef4444;
    --blue: #3b82f6;
    --border: #2a2e42;
  }
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: var(--bg-main); color: var(--text-main); margin: 0; padding: 16px; padding-bottom: 40px; }
  
  .container { max-width: 600px; margin: 0 auto; }

  /* Блок ввода */
  .input-box { background: var(--bg-card); border-radius: 16px; padding: 16px; margin-bottom: 20px; border: 1px solid var(--border); }
  textarea { width: 100%; height: 140px; background: #0f111a; border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 8px; font-size: 14px; resize: vertical; outline: none; margin-bottom: 12px; font-family: monospace; line-height: 1.5;}
  textarea::placeholder { color: #64748b; }
  
  .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .btn { padding: 12px; border-radius: 8px; border: none; font-weight: 700; font-size: 14px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 6px; text-align: center; transition: 0.2s;}
  
  .btn-calc { background: var(--green); color: #000; }
  .btn-clear { background: #334155; color: #fff; }
  .btn-wa { background: var(--blue); color: #fff; }

  /* Блок наценки */
  .markup-box { background: var(--bg-card); border-radius: 12px; padding: 12px; margin-bottom: 20px; display: none; border: 1px solid var(--green); align-items: center; justify-content: space-between; gap: 10px;}
  .markup-box input { width: 120px; background: #0f111a; border: 1px solid #475569; color: var(--green); padding: 10px; border-radius: 8px; font-size: 16px; font-weight: 700; text-align: center; outline: none;}

  /* Блок статистики */
  .stats-box { background: #1e3a8a; border: 1px solid #3b82f6; border-radius: 12px; padding: 15px; margin-bottom: 20px; display: none; justify-content: space-between; align-items: center; color: #fff;}
  .stats-title { font-size: 13px; color: #93c5fd; margin-bottom: 4px; font-weight: 600;}
  .stats-value { font-size: 18px; font-weight: 800;}

  /* Витрина */
  .preview-wrapper { margin-bottom: 30px; }
  .preview-container { background: #000; border-radius: 24px; padding: 2px; border: 1px solid #333; margin-bottom: 10px; overflow: hidden;}
  .poster { padding: 30px 20px; text-align: center; border-radius: 22px; background: radial-gradient(circle at top, #1a0e12 0%, #050508 60%); }
  
  /* Заголовки витрины */
  .poster-brand { font-size: 24px; font-weight: 900; color: #fff; margin-bottom: 4px; letter-spacing: 1px;}
  .poster-subtitle { font-size: 11px; font-weight: 700; color: var(--red); text-transform: uppercase; margin-bottom: 25px; letter-spacing: 1px;}
  
  .poster-list { display: flex; flex-direction: column; gap: 10px; }
  .poster-item { border-radius: 14px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; text-align: left; gap: 10px; background: rgba(30, 20, 20, 0.5); border: 1px solid rgba(255,255,255,0.05); }
  .p-name { font-size: 14px; font-weight: 700; color: #fff; line-height: 1.3; flex: 1;}
  .p-qty { font-size: 11px; background: #334155; color: #fff; padding: 2px 6px; border-radius: 4px; margin-left: 4px;}
  .p-price { font-size: 18px; font-weight: 800; white-space: nowrap; color: var(--green);}
  
  .poster-footer { margin-top: 25px; border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 8px; text-align: center; border: 1px solid #3f2e14; background: rgba(63, 46, 20, 0.2); }
  .footer-title { font-size: 14px; font-weight: 800; color: #f5c76a; }
  .footer-sub { font-size: 12px; color: #aaa;}
  .footer-phone { margin-top: 10px; padding-top: 12px; border-top: 1px dashed #5a4020; font-size: 18px; font-weight: 800; letter-spacing: 1px; color: var(--green); }
  
  .btn-save-page { background: #e11d48; color: #fff; width: 100%; padding: 12px; font-size: 15px; margin-bottom: 15px; border-radius: 8px;}
  .empty-text { font-size: 13px; color: #64748b; margin: 30px 0;}
</style>
</head>
<body>

<div class="container">
  
  <div class="input-box">
    <textarea id="textInput" placeholder="Вставьте список сюда..."></textarea>
    
    <div class="btn-grid">
      <button class="btn btn-calc" onclick="processText()">Рассчитать</button>
      <button class="btn btn-clear" onclick="clearAll()">Очистить</button>
    </div>
    <div class="btn-grid">
      <button class="btn btn-wa" onclick="copyText()">📱 Текст в WhatsApp</button>
    </div>
  </div>

  <div class="markup-box" id="markupBox">
    <div style="font-size: 14px; font-weight: 700;">Наценка (₽):</div>
    <input type="number" id="markupInput" value="3000" oninput="applyMarkup()">
  </div>

  <div class="stats-box" id="statsBox">
    <div>
      <div class="stats-title">Количество товаров:</div>
      <div class="stats-value" id="statCount">0 шт</div>
    </div>
    <div style="text-align: right;">
      <div class="stats-title">Общая сумма:</div>
      <div class="stats-value" id="statTotal">0 ₽</div>
    </div>
  </div>

  <div id="postersOutput"></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
  let items = [];
  let currentMarkup = 3000;
  let depositText = "Аванс всего 3000 ₽. Экономьте!";

  function processText() {
    const text = document.getElementById('textInput').value;
    if(!text.trim()) return alert('Вставьте текст');

    const lines = text.split('\n');
    items = [];
    let depositFound = "";

    lines.forEach(line => {
      let cleanLine = line.trim();
      if (!cleanLine) return;
      let lowerLine = cleanLine.toLowerCase();

      // 1. Ищем инфу о брони (если есть)
      if (lowerLine.includes('бронь') || lowerLine.includes('аванс') || lowerLine.includes('оплата при получении')) {
          depositFound = cleanLine; return;
      }

      // 2. Игнорируем строки с "Выдача" или "Предзаказ" (они больше не нужны)
      if (lowerLine.includes('выдача') || lowerLine.includes('пред заказ') || lowerLine.includes('предзаказ')) {
          return;
      }

      // 3. Ищем КОЛИЧЕСТВО (только если есть слово "шт", "штук" и т.д.)
      let qty = 1;
      const qtyRegex = /(\d+)\s*(шт|штук|штуки|шт\.)/i;
      const qtyMatch = cleanLine.match(qtyRegex);
      if (qtyMatch) {
         qty = Number(qtyMatch[1]);
      }

      // 4. Ищем ЦЕНУ (от 4 до 7 цифр). 
      let price = 0;
      const priceRegex = /\b(\d{4,7})\b/g;
      let matches = [...cleanLine.matchAll(priceRegex)];
      
      if (matches.length > 0) {
        price = Number(matches[matches.length - 1][1]);
        
        let namePart = cleanLine.substring(0, matches[matches.length - 1].index).replace(/[-—@]/g, ' ').trim();
        namePart = namePart.replace(/iPhone/gi, '').replace(/[()]/g, '').trim();
        namePart = namePart.toUpperCase().replace(/\s+/g, ' ');

        if (namePart.length > 2 && price > 0) {
          items.push({ name: namePart, buyPrice: price, qty: qty });
        }
      }
    });

    if (items.length === 0) return alert('Не найдено ни одной цены.');

    if (depositFound) depositText = depositFound;

    document.getElementById('markupBox').style.display = 'flex';
    document.getElementById('statsBox').style.display = 'flex';
    applyMarkup(); 
  }

  window.applyMarkup = function() {
    currentMarkup = Number(document.getElementById('markupInput').value) || 0;
    renderPosters();
  }

  function renderPosters() {
    const outputContainer = document.getElementById('postersOutput');
    outputContainer.innerHTML = '';

    if (items.length === 0) return;

    let totalSumAll = 0;
    let totalQtyAll = 0;
    
    items.forEach(item => {
        totalSumAll += (item.buyPrice + currentMarkup) * item.qty;
        totalQtyAll += item.qty;
    });
    
    document.getElementById('statCount').textContent = totalQtyAll + ' шт';
    document.getElementById('statTotal').textContent = totalSumAll.toLocaleString('ru-RU') + ' ₽';

    // Рисуем картинку БЕЗ блока с датой
    let html = `
      <div class="preview-container" id="poster_page_1">
        <div class="poster">
          <div class="poster-brand">FREE ZONE</div>
          <div class="poster-subtitle">ЛУЧШИЕ ЦЕНЫ</div>
          <div class="poster-list">
    `;
    
    items.forEach(item => {
      const finalPrice = item.buyPrice + currentMarkup;
      const qtyLabel = item.qty > 1 ? `<span class="p-qty">${item.qty} шт</span>` : '';
      
      html += `
        <div class="poster-item">
          <div class="p-name">${item.name} ${qtyLabel}</div>
          <div class="p-price">${finalPrice.toLocaleString('ru-RU')} ₽</div>
        </div>
      `;
    });

    html += `
          </div>
          <div class="poster-footer">
            <div class="footer-title">💳 Доступна рассрочка</div>
            <div class="footer-sub">Без банков и переплат</div>
            <div class="footer-title" style="margin-top: 8px;">🔥 Предзаказ ВЫГОДНЕЕ!</div>
            <div class="footer-sub">${depositText}</div>
            <div style="font-size: 12px; color: #aaa; margin-top: 15px;">Заказ по телефону / WhatsApp:</div>
            <div class="footer-phone">+7 988 783-66-77</div>
          </div>
        </div>
      </div>
      <button class="btn btn-save-page" onclick="saveSingleImage()">📥 Нажми чтобы открыть фото</button>
    `;
    
    outputContainer.innerHTML = html;
  }

  window.saveSingleImage = function() {
    const element = document.getElementById(`poster_page_1`);
    if (!element) return;

    const btn = event.target;
    const originalText = btn.innerHTML;
    btn.innerHTML = "⏳ Генерируем...";

    html2canvas(element, { scale: 2, backgroundColor: '#0f111a', useCORS: true }).then(canvas => {
      const imgData = canvas.toDataURL('image/png');
      const win = window.open();
      win.document.write(`
        <body style="margin:0; background:#000; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh;">
          <p style="color:#fff; font-family:sans-serif; text-align:center; padding:10px;">Зажмите на картинку и выберите «Сохранить в Фото»</p>
          <img src="${imgData}" style="width:100%; max-width:600px; display:block;" />
        </body>
      `);
      btn.innerHTML = originalText;
    });
  }

  window.clearAll = function() {
    document.getElementById('textInput').value = '';
    document.getElementById('markupBox').style.display = 'none';
    document.getElementById('statsBox').style.display = 'none';
    document.getElementById('postersOutput').innerHTML = '<div style="text-align:center; padding:30px; color:#64748b;">Вставьте текст и нажмите "Рассчитать"</div>';
    items = [];
  }

  window.copyText = function() {
    if (items.length === 0) return alert('Сначала нажмите "Рассчитать"');

    let text = "🔥 *FREE ZONE (В наличии)*\n\n";
    let totalSum = 0;
    let totalQty = 0;

    items.forEach(item => {
      const finalPrice = item.buyPrice + currentMarkup;
      totalSum += finalPrice * item.qty;
      totalQty += item.qty;
      const qtyStr = item.qty > 1 ? ` (${item.qty} шт)` : '';
      text += `▪️ ${item.name}${qtyStr}\n   Цена: *${finalPrice.toLocaleString('ru-RU')} ₽*\n\n`;
    });
    
    text += `💰 *ИТОГО: ${totalQty} шт на сумму ${totalSum.toLocaleString('ru-RU')} ₽*\n\n`;
    text += "💳 Доступна рассрочка\n";
    text += depositText + "\n\n";
    text += "📞 Заказ: +7 988 783-66-77";
    
    navigator.clipboard.writeText(text).then(() => { 
      alert("Текст скопирован! Вставьте его в WhatsApp."); 
    });
  }
  
  window.onload = function() {
    document.getElementById('postersOutput').innerHTML = '<div style="text-align:center; padding:30px; color:#64748b;">Вставьте текст и нажмите "Рассчитать"</div>';
  }
</script>
</body>
</html>
