<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FREE ZONE - Каталог</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  body { background-color: #0f0f13; color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; margin: 0; padding-bottom: 80px;}
  .container { max-width: 500px; margin: 0 auto; }
  
  /* Панель Админа */
  .admin-panel { background: #1a1a20; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #333; }
  .admin-panel textarea { width: 100%; height: 100px; background: #0f0f13; color: white; border: 1px solid #444; border-radius: 8px; padding: 10px; box-sizing: border-box; font-family: monospace; font-size: 13px; margin-bottom: 10px; }
  .input-group { display: flex; gap: 10px; margin-bottom: 10px; }
  .input-group input { flex: 1; background: #0f0f13; color: white; border: 1px solid #444; border-radius: 8px; padding: 10px; font-size: 16px; }
  .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 8px;}
  .btn-green { background: #00ff88; color: #000; }
  .btn-red { background: #e6194b; color: white; }
  .btn-blue { background: #007aff; color: white; }
  
  /* Каталог */
  .header-text { color: #e0a800; font-size: 14px; font-weight: bold; margin-bottom: 15px; text-transform: uppercase; text-align: center;}
  
  .card { 
    background: #1a1a20; 
    border-radius: 10px; 
    padding: 15px; 
    margin-bottom: 10px; 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    border: 1px solid #2a2a35;
  }
  .info { flex: 1; padding-right: 10px; }
  .title { font-weight: bold; font-size: 15px; margin-bottom: 4px; }
  .desc { color: #888; font-size: 12px; }
  
  .price-block { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 8px;}
  .price { font-size: 16px; font-weight: bold; color: #fff; white-space: nowrap;}
  .btn-add { background: #007aff; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; }
  .btn-add.added { background: #00ff88; color: #000; }

  /* Корзина */
  .cart-bar { 
    position: fixed; bottom: 0; left: 0; right: 0; 
    background: #1a1a20; border-top: 1px solid #333; 
    padding: 15px; display: none; justify-content: space-between; align-items: center;
    box-shadow: 0 -5px 15px rgba(0,0,0,0.5); z-index: 100;
  }
  .cart-bar.show { display: flex; }
  .cart-info { font-size: 14px; }
  .cart-total { font-size: 18px; font-weight: bold; color: #00ff88; }
  .btn-checkout { background: #e6194b; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; }

  .footer { background: #1a1a20; border: 1px solid #4a3a1a; border-radius: 12px; padding: 15px; margin-top: 20px; text-align: center; }
  .footer h4 { color: #e0a800; margin: 0 0 5px 0; font-size: 14px;}
  .footer p { font-size: 12px; color: #ccc; margin: 5px 0 10px 0; }
  .phone { color: #00ff88; font-size: 18px; font-weight: bold; text-decoration: none; }

  /* Скрытие админки в режиме клиента */
  .client-mode .admin-panel { display: none; }
  .client-mode .btn-download { display: none; }
</style>
</head>
<body>

<div class="container">
  
  <!-- ПАНЕЛЬ АДМИНА (Видна только вам) -->
  <div class="admin-panel" id="admin-panel">
    <h3 style="margin-top:0; color:#e6194b;">Режим Администратора</h3>
    <textarea id="input-text" placeholder="Вставьте список сюда (как обычно):&#10;🇮🇩A57 8/256 Grey 33000&#10;🇲🇾A57 12/512 Navy 40000"></textarea>
    <div class="input-group">
      <input type="number" id="markup-val" placeholder="Наценка" value="0">
      <select id="markup-type" style="background:#0f0f13; color:white; border:1px solid #444; border-radius:8px; padding:10px; font-size:16px;">
        <option value="rub">₽</option>
        <option value="percent">%</option>
      </select>
    </div>
    <button class="btn btn-green" onclick="generateLink()">🔗 Сгенерировать ссылку для клиента</button>
    <button class="btn btn-red" id="btn-download" onclick="downloadImage()">📥 Скачать картинку (для WhatsApp)</button>
  </div>

  <!-- КАТАЛОГ (Виден клиенту) -->
  <div id="catalog-area">
    <div class="header-text">
      ПРЕДЗАКАЗ ДО 17:00<br>ВЫДАЧА НА СУББОТУ
    </div>

    <div id="result-list">
      <div style="text-align:center; color:#666; padding: 20px;">Загрузка...</div>
    </div>

    <div class="footer">
      <h4>💳 Доступна рассрочка</h4>
      <p>Без банков и переплат</p>
      <h4>🔥 Предзаказ ВЫГОДНЕЕ!</h4>
      <p>Аванс всего 3000 ₽. Экономьте!</p>
      <hr style="border-color: #333; margin: 10px 0;">
      <p>Заказ по телефону / WhatsApp:</p>
      <a href="tel:+79887836677" class="phone">+7 988 783-66-77</a>
    </div>
  </div>

</div>

<!-- ПЛАВАЮЩАЯ КОРЗИНА -->
<div class="cart-bar" id="cart-bar">
  <div class="cart-info">Товаров: <span id="cart-count">0</span><br><span class="cart-total" id="cart-total">0 ₽</span></div>
  <button class="btn-checkout" onclick="checkout()">Оформить заказ</button>
</div>

<script>
  let cart = [];
  let currentData = [];
  let isClientMode = false;

  // Проверяем, есть ли данные в ссылке (если да - значит это клиент)
  window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    const dataParam = urlParams.get('data');
    
    if (dataParam) {
      isClientMode = true;
      document.body.classList.add('client-mode');
      // Расшифровываем данные из ссылки
      try {
        currentData = JSON.parse(decodeURIComponent(escape(atob(dataParam))));
        renderCatalog(currentData);
      } catch (e) {
        document.getElementById('result-list').innerHTML = "Ошибка загрузки данных. Ссылка повреждена.";
      }
    } else {
      // Это админ. Показываем пустой экран или демо
      renderCatalog([]);
    }
  };

  // Функция для Админа: Создание ссылки
  function generateLink() {
    const rawText = document.getElementById('input-text').value;
    const markupVal = parseFloat(document.getElementById('markup-val').value) || 0;
    const markupType = document.getElementById('markup-type').value;
    
    if (!rawText.trim()) return alert("Сначала вставьте список!");

    // Парсим текст и применяем наценку
    const lines = rawText.split('\n');
    let parsedData = [];
    
    lines.forEach(line => {
      line = line.trim();
      if (!line) return;
      
      const priceMatch = line.match(/^(.*?)\s+(\d+)$/);
      if (priceMatch) {
        const name = priceMatch[1].trim();
        const originalPrice = parseInt(priceMatch[2]);
        
        let finalPrice = originalPrice;
        if (markupType === 'rub') finalPrice += markupVal;
        else finalPrice = Math.round(originalPrice * (1 + markupVal / 100));

        parsedData.push({ name: name, price: finalPrice });
      } else {
         // Заголовки групп (например, если написано просто "Samsung")
         parsedData.push({ name: line, isHeader: true });
      }
    });

    // Кодируем данные в Base64 (безопасно для ссылки)
    const jsonStr = JSON.stringify(parsedData);
    const encodedData = btoa(unescape(encodeURIComponent(jsonStr)));
    
    // Формируем ссылку
    const baseUrl = window.location.origin + window.location.pathname;
    const clientLink = `${baseUrl}?data=${encodedData}`;
    
    // Копируем в буфер
    navigator.clipboard.writeText(clientLink).then(() => {
      alert("✅ Ссылка для клиента создана и скопирована!\n\nОтправьте её клиенту. По ней он увидит только финальные цены и сможет собрать корзину.");
      // Рисуем превью для админа
      currentData = parsedData;
      renderCatalog(currentData);
    }).catch(err => {
      prompt("Не удалось скопировать автоматически. Скопируйте ссылку вручную:", clientLink);
    });
  }

  // Отрисовка каталога (работает и для админа, и для клиента)
  function renderCatalog(data) {
    const container = document.getElementById('result-list');
    container.innerHTML = '';
    
    if (!data || data.length === 0) {
      container.innerHTML = '<div style="text-align:center; color:#666; padding: 20px;">Вставьте текст и нажмите "Сгенерировать ссылку"</div>';
      return;
    }

    const formatPrice = (num) => num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");

    data.forEach((item, index) => {
      if (item.isHeader) {
        container.innerHTML += `<div class="header-text" style="margin-top:15px; text-align:left;">${item.name}</div>`;
        return;
      }

      // Парсим модель и характеристики
      let title = item.name;
      let desc = "";
      const specMatch = item.name.match(/(.*?)\s+(\d+\/\d+.*)/);
      if (specMatch) {
        title = specMatch[1];
        desc = specMatch[2];
      }

      // Проверяем, есть ли уже в корзине
      const inCart = cart.some(c => c.name === item.name);
      const btnClass = inCart ? 'btn-add added' : 'btn-add';
      const btnText = inCart ? '✓ В корзине' : 'Купить';

      container.innerHTML += `
        <div class="card">
          <div class="info">
            <div class="title">${title}</div>
            <div class="desc">${desc}</div>
          </div>
          <div class="price-block">
            <span class="price">${formatPrice(item.price)} ₽</span>
            ${isClientMode ? `<button class="${btnClass}" onclick="toggleCart(${index}, '${item.name}', ${item.price})">${btnText}</button>` : ''}
          </div>
        </div>
      `;
    });
  }

  // Добавление/Удаление из корзины
  function toggleCart(index, name, price) {
    const existingIndex = cart.findIndex(c => c.name === name);
    
    if (existingIndex > -1) {
      cart.splice(existingIndex, 1); // Удаляем
    } else {
      cart.push({ name: name, price: price }); // Добавляем
    }
    
    updateCartUI();
    renderCatalog(currentData); // Перерисовываем кнопки
  }

  function updateCartUI() {
    const bar = document.getElementById('cart-bar');
    if (cart.length > 0) {
      bar.classList.add('show');
      document.getElementById('cart-count').innerText = cart.length;
      const total = cart.reduce((sum, item) => sum + item.price, 0);
      document.getElementById('cart-total').innerText = total.toLocaleString('ru-RU') + ' ₽';
    } else {
      bar.classList.remove('show');
    }
  }

  // Оформление заказа (отправка в WhatsApp)
  function checkout() {
    if (cart.length === 0) return;

    let message = "🔥 *НОВЫЙ ЗАКАЗ С САЙТА* 🔥\n\n";
    let total = 0;

    cart.forEach((item, i) => {
      message += `${i+1}. ${item.name} — ${item.price.toLocaleString('ru-RU')} ₽\n`;
      total += item.price;
    });

    message += `\n💰 *ИТОГО: ${total.toLocaleString('ru-RU')} ₽*\n\n`;
    message += `Пожалуйста, подтвердите наличие и реквизиты для оплаты.`;

    // Кодируем текст для ссылки WhatsApp
    const encodedMessage = encodeURIComponent(message);
    const phone = "79887836677"; // ВАШ НОМЕР ТЕЛЕФОНА БЕЗ + И ПРОБЕЛОВ
    
    window.open(`https://wa.me/${phone}?text=${encodedMessage}`, '_blank');
  }

  // Скачивание картинки (для админа)
  function downloadImage() {
    html2canvas(document.getElementById('catalog-area'), {
        scale: 2,
        backgroundColor: "#0f0f13",
        useCORS: true
    }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'prays.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    });
  }
</script>

</body>
</html>
