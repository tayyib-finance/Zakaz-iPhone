  <!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Генератор витрины</title>
<style>
  :root { --bg-main:#0f111a; --bg-card:#1a1d2d; --text-muted:#8b92a5; --green:#4ade80; --blue:#3b82f6; --border:#2a2e42; }
  * { box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  body { background:var(--bg-main); color:#fff; margin:0; padding:16px 16px 40px; }
  .container { max-width:600px; margin:0 auto; }
  .tabs { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px; }
  .tab { background:var(--bg-card); color:var(--text-muted); border:1px solid var(--border); border-radius:10px; padding:11px; font-size:14px; font-weight:800; cursor:pointer; }
  .tab.on { color:#000; background:var(--green); border-color:var(--green); }
  .input-box { background:var(--bg-card); border-radius:16px; padding:16px; margin-bottom:20px; border:1px solid var(--border); }
  textarea { width:100%; height:140px; background:#0f111a; border:1px solid var(--border); color:#fff; padding:12px; border-radius:8px; font-size:14px; resize:vertical; outline:none; margin-bottom:12px; font-family:monospace; line-height:1.5; }
  .btn-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
  .btn { padding:12px; border-radius:8px; border:none; font-weight:700; font-size:14px; cursor:pointer; display:flex; justify-content:center; align-items:center; gap:6px; }
  .btn-calc { background:var(--green); color:#000; } .btn-clear { background:#334155; color:#fff; } .btn-wa { background:var(--blue); color:#fff; }
  .markup-box { background:var(--bg-card); border-radius:12px; padding:12px; margin-bottom:20px; display:none; border:1px solid var(--green); align-items:center; justify-content:space-between; gap:10px; }
  .markup-box input { width:120px; background:#0f111a; border:1px solid #475569; color:var(--green); padding:10px; border-radius:8px; font-size:16px; font-weight:700; text-align:center; outline:none; }
  .stats-box { background:#1e3a8a; border:1px solid #3b82f6; border-radius:12px; padding:15px; margin-bottom:20px; display:none; justify-content:space-between; align-items:center; }
  .stats-title { font-size:13px; color:#93c5fd; margin-bottom:4px; font-weight:600; } .stats-value { font-size:18px; font-weight:800; }
  .hint-row { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; font-size:12px; color:var(--text-muted); }
  .btn-reset { background:#334155; color:#fff; border:none; border-radius:8px; padding:8px 12px; font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap; }
  .themes { display:flex; gap:8px; overflow-x:auto; margin-bottom:12px; padding-bottom:4px; }
  .theme-btn { background:var(--bg-card); color:#fff; border:1px solid var(--border); border-radius:10px; padding:8px 10px; font-size:12px; font-weight:700; white-space:nowrap; display:flex; align-items:center; gap:6px; cursor:pointer; }
  .theme-btn.on { border-color:#fff; }
  .sw { width:18px; height:18px; border-radius:50%; border:1px solid rgba(255,255,255,.4); display:inline-block; }
  .preview-container { border-radius:24px; border:1px solid rgba(128,128,128,.35); margin-bottom:10px; overflow:hidden; }
  .poster { padding:30px 20px; text-align:center; }
  .poster-brand { font-size:24px; font-weight:900; margin-bottom:4px; letter-spacing:1px; }
  .poster-subtitle { font-size:11px; font-weight:700; text-transform:uppercase; margin-bottom:25px; letter-spacing:1px; }
  .poster-list { display:flex; flex-direction:column; gap:10px; }
  .poster-section { font-size:14px; font-weight:800; letter-spacing:.5px; text-align:center; margin-top:14px; padding:9px 12px; border-radius:999px; border:1px solid; }
  .poster-section:first-child { margin-top:0; }
  .model-head { display:flex; align-items:center; gap:10px; margin-top:6px; }
  .model-head .ln { flex:1; height:1px; }
  .model-head .lb { font-size:13px; font-weight:800; letter-spacing:1px; }
  .poster-item { border-radius:14px; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; text-align:left; gap:10px; border:1px solid; }
  .p-name { font-size:14px; font-weight:700; line-height:1.3; flex:1; }
  .p-qty { font-size:11px; background:#334155; color:#fff; padding:2px 6px; border-radius:4px; margin-left:4px; }
  .p-price { font-size:18px; font-weight:800; white-space:nowrap; }
  .poster-footer { margin-top:25px; border-radius:12px; padding:15px; display:flex; flex-direction:column; gap:8px; text-align:center; border:1px solid; }
  .footer-title { font-size:14px; font-weight:800; } .footer-sub { font-size:12px; }
  .footer-label { font-size:12px; margin-top:15px; }
  .footer-phone { margin-top:10px; padding-top:12px; border-top:1px dashed; font-size:18px; font-weight:800; letter-spacing:1px; }
  [contenteditable] { -webkit-user-select:text; user-select:text; outline:none; min-width:30px; border-radius:6px; }
  [contenteditable]:focus { outline:1px dashed #888; outline-offset:3px; background:rgba(128,128,128,.15); }
  .custom-price { text-decoration:underline dotted; text-underline-offset:4px; }
  .btn-save-page { background:#e11d48; color:#fff; width:100%; padding:12px; font-size:15px; margin-bottom:15px; border-radius:8px; }
  .blk-panel { background:var(--bg-card); border:1px solid var(--border); border-radius:14px; padding:12px; margin-bottom:15px; }
  .blk-h { font-size:14px; font-weight:800; margin-bottom:4px; }
  .blk-hint { font-size:12px; color:var(--text-muted); margin-bottom:8px; }
  .blk { padding:10px 0; border-top:1px solid var(--border); }
  .blk-t { font-size:13px; font-weight:800; margin-bottom:8px; }
  .blk-t span { color:var(--text-muted); font-weight:600; font-size:11px; margin-left:4px; }
  .blk-b { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { background:#334155; color:#fff; border:none; border-radius:8px; padding:9px 12px; font-size:13px; font-weight:700; cursor:pointer; }
  .chip.main { background:var(--green); color:#000; }
  .name-input { width:100%; background:#0f111a; border:1px solid var(--border); color:#fff; padding:10px; border-radius:8px; font-size:14px; font-weight:700; outline:none; margin-bottom:8px; }
  .cmp-sum { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
  .cmp-chip { background:var(--bg-card); border:1px solid var(--border); border-radius:10px; padding:10px; font-size:12px; color:var(--text-muted); }
  .cmp-chip b { display:block; font-size:18px; color:#fff; margin-top:2px; }
  .cmp-head, .cmp-row { display:grid; grid-template-columns:1fr 92px 92px; gap:6px; align-items:center; }
  .cmp-head { font-size:11px; font-weight:800; color:var(--text-muted); padding:0 4px 6px; text-align:center; }
  .cmp-head span:first-child { text-align:left; }
  .cmp-sec { margin:14px 0 6px; padding:8px 12px; border-radius:999px; font-size:13px; font-weight:800; text-align:center; background:rgba(59,130,246,.12); color:#93c5fd; border:1px solid rgba(96,165,250,.4); }
  .cmp-mod { margin:10px 0 4px; font-size:12px; font-weight:800; letter-spacing:1px; color:#f5c76a; }
  .cmp-row { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:8px; margin-bottom:6px; }
  .cmp-name { font-size:13px; font-weight:700; line-height:1.3; }
  .cmp-cell { text-align:center; border-radius:8px; padding:6px 2px; font-size:14px; font-weight:800; color:#cbd5e1; }
  .cmp-cell small { display:block; font-size:10px; font-weight:700; margin-top:1px; }
  .cmp-cell.best { background:rgba(74,222,128,.16); color:var(--green); }
  .cmp-cell.worse { color:#fca5a5; }
  .cmp-cell.none { color:#475569; }
</style>
</head>
<body>
<div class="container">

  <div class="tabs">
    <button class="tab on" id="tabShow" onclick="setView('show')">📋 Витрина</button>
    <button class="tab" id="tabCmp" onclick="setView('cmp')">⚖️ Сравнение</button>
  </div>

  <div id="viewShow">
    <div class="input-box">
      <textarea id="textInput" placeholder="Вставьте список сюда..."></textarea>
      <div class="btn-grid">
        <button class="btn btn-calc" onclick="processText()">Рассчитать</button>
        <button class="btn btn-clear" onclick="clearAll()">Очистить</button>
      </div>
      <div class="btn-grid"><button class="btn btn-wa" onclick="copyText()">📱 Текст в WhatsApp</button></div>
    </div>

    <div class="markup-box" id="markupBox">
      <div style="font-size:14px;font-weight:700;">Наценка (₽):</div>
      <input type="number" id="markupInput" value="3000" oninput="applyMarkup()">
    </div>

    <div class="stats-box" id="statsBox">
      <div><div class="stats-title">Количество товаров:</div><div class="stats-value" id="statCount">0 шт</div></div>
      <div style="text-align:right;"><div class="stats-title">Общая сумма:</div><div class="stats-value" id="statTotal">0 ₽</div></div>
    </div>

    <div id="postersOutput"></div>
  </div>

  <div id="viewCmp" style="display:none;">
    <div class="input-box">
      <input class="name-input" id="nameA" value="Прайс 1">
      <textarea id="cmpA" placeholder="Вставьте первый прайс..."></textarea>
      <input class="name-input" id="nameB" value="Прайс 2">
      <textarea id="cmpB" placeholder="Вставьте второй прайс..."></textarea>
      <div class="btn-grid">
        <button class="btn btn-calc" onclick="runCompare()">Сравнить</button>
        <button class="btn btn-clear" onclick="clearCompare()">Очистить</button>
      </div>
    </div>
    <div id="cmpOutput"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
  let items = [];
  let blocks = [];
  let cmpRows = [];
  let currentMarkup = 3000;
  const defaultAd = {
    t1: '💳 Доступна рассрочка',
    s1: 'Без банков и переплат',
    t2: '🔥 Предзаказ ВЫГОДНЕЕ!',
    s2: 'Аванс всего 3000 ₽. Экономьте!',
    s3: 'Заказ по телефону / WhatsApp:',
    phone: '+7 988 783-66-77'
  };
  let ad = { ...defaultAd };

  const SIM_ORDER = ['SIM + eSIM', 'SIM', 'eSIM'];
  const MODEL_EMOJI = ['🟩', '🟦', '🟪', '🟧', '🟨'];

  const THEMES = [
    { name:'Неон', base:'#050508', pbg:'radial-gradient(circle at top,#1a0e12 0%,#050508 60%)', txt:'#ffffff', muted:'#aaaaaa', brand:'#ffffff', sub:'#ef4444',
      footBg:'rgba(63,46,20,.25)', footBr:'#3f2e14', ft:'#f5c76a', phone:'#4ade80',
      pal:['#4ade80','#60a5fa','#f472b6','#fbbf24','#a78bfa'], sims:['#60a5fa','#fb923c','#4ade80'] },
    { name:'Золото', base:'#000000', pbg:'linear-gradient(160deg,#1a1408,#000000)', txt:'#fff4d6', muted:'#bfa76a', brand:'#f5c76a', sub:'#d4a017',
      footBg:'rgba(245,199,106,.08)', footBr:'rgba(245,199,106,.35)', ft:'#f5c76a', phone:'#f5c76a',
      pal:['#f5c76a','#e8b4a0','#d9d9d9','#c9a227','#f0e0a0'], sims:['#f5c76a','#e8b4a0','#d9d9d9'] },
    { name:'Океан', base:'#020b18', pbg:'linear-gradient(160deg,#06213f,#020b18)', txt:'#ffffff', muted:'#9cc4e8', brand:'#7dd3fc', sub:'#38bdf8',
      footBg:'rgba(56,189,248,.10)', footBr:'rgba(56,189,248,.35)', ft:'#7dd3fc', phone:'#5eead4',
      pal:['#38bdf8','#5eead4','#a5b4fc','#fbbf24','#93c5fd'], sims:['#7dd3fc','#fbbf24','#5eead4'] },
    { name:'Светлая', base:'#f4f5f9', pbg:'#f4f5f9', txt:'#111827', muted:'#6b7280', brand:'#111827', sub:'#e11d48',
      footBg:'rgba(17,24,39,.05)', footBr:'rgba(17,24,39,.2)', ft:'#111827', phone:'#16a34a',
      pal:['#16a34a','#2563eb','#db2777','#d97706','#7c3aed'], sims:['#2563eb','#ea580c','#16a34a'] },
    { name:'Закат', base:'#12061f', pbg:'linear-gradient(160deg,#2a0f3d,#12061f 55%,#3d0f1f)', txt:'#ffffff', muted:'#d1b3e6', brand:'#ffd1f0', sub:'#fb7185',
      footBg:'rgba(251,113,133,.10)', footBr:'rgba(251,113,133,.35)', ft:'#fda4af', phone:'#fde68a',
      pal:['#fb7185','#fbbf24','#c084fc','#f9a8d4','#fdba74'], sims:['#c084fc','#fbbf24','#fb7185'] }
  ];
  let themeIdx = 0;
  try { themeIdx = Number(localStorage.getItem('fzTheme')) || 0; } catch (e) {}
  if (themeIdx < 0 || themeIdx >= THEMES.length) themeIdx = 0;

  const fmt = n => n.toLocaleString('ru-RU');
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const title = s => s.toLowerCase().replace(/(^|\s)(\S)/g, (m, a, b) => a + b.toUpperCase());
  const finalPrice = it => (it.custom != null ? it.custom : it.buyPrice + currentMarkup);
  const rgba = (hex, a) => {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
  };

  function colorDot(color) {
    const c = color.toUpperCase();
    const map = [
      [/BLACK|NIGHT|ЧЕРН|ЧЁРН|SPACE|GRAY|GREY|GRAPHITE/, '⚫'],
      [/SILVER|WHITE|СЕРЕБР|БЕЛ|STARLIGHT/, '⚪'],
      [/BLUE|СИН|ГОЛУБ|GLACIER|SKY/, '🔵'],
      [/ORANGE|ОРАНЖ/, '🟠'],
      [/RED|BURGUNDY|БОРДО|КРАСН/, '🔴'],
      [/GREEN|ЗЕЛ/, '🟢'],
      [/GOLD|YELLOW|ЖЕЛТ|ЖЁЛТ|ЗОЛОТ/, '🟡'],
      [/PURPLE|VIOLET|LAVENDER|ФИОЛ|СИРЕН/, '🟣'],
      [/PINK|РОЗ/, '🩷'],
      [/TITANIUM|NATURAL|DESERT|ТИТАН|БЕЖ/, '🟤']
    ];
    for (const [re, dot] of map) if (re.test(c)) return dot;
    return '▫️';
  }

  function parseName(name) {
    const r = { model: name, storage: '', raw: '', gb: 0, color: '', sim: 'eSIM' };
    const m = name.match(/^(.*?)\s+(128|256|512|1\s?TB|2\s?TB)\b\s*(.*)$/);
    let rest = name;
    if (m) {
      r.model = m[1];
      const s = m[2].replace(/\s/g, '');
      r.raw = s;
      r.storage = s === '1TB' ? '1 ТБ' : s === '2TB' ? '2 ТБ' : s + ' ГБ';
      r.gb = s === '1TB' ? 1024 : s === '2TB' ? 2048 : Number(s);
      rest = m[3];
    }
    if (/SIM\s*\+\s*ESIM|2\s?SIM/.test(rest)) r.sim = 'SIM + eSIM';
    else if (!/ESIM/.test(rest)) r.sim = /SIM/.test(rest) ? 'SIM' : 'eSIM';
    r.color = title(rest.replace(/1?\s?SIM\s*\+\s*ESIM|2\s?SIM|ESIM|SIM/g, '').trim());
    r.model = title(r.model);
    return r;
  }

  function modelRank(m) {
    const l = m.toLowerCase();
    if (/max/.test(l)) return 2;
    if (/pro/.test(l)) return 1;
    if (/^\d+\s*(plus)?$/.test(l)) return 0;
    return 3;
  }

  function sortList(arr) {
    return arr
      .map((it, idx) => ({ it, idx }))
      .sort((a, b) =>
        (SIM_ORDER.indexOf(a.it.sim) - SIM_ORDER.indexOf(b.it.sim)) ||
        ((parseInt(b.it.model) || 0) - (parseInt(a.it.model) || 0)) ||
        (modelRank(a.it.model) - modelRank(b.it.model)) ||
        a.it.model.localeCompare(b.it.model) ||
        (a.it.gb - b.it.gb) ||
        (a.idx - b.idx))
      .map(x => x.it);
  }

  function parseList(text) {
    const list = [];
    let deposit = '';
    text.split('\n').forEach(line => {
      const cleanLine = line.trim();
      if (!cleanLine) return;
      const low = cleanLine.toLowerCase();
      if (low.includes('бронь') || low.includes('аванс') || low.includes('оплата при получении')) { deposit = cleanLine; return; }
      if (low.includes('выдача') || low.includes('пред заказ') || low.includes('предзаказ')) return;

      let qty = 1;
      const qm = cleanLine.match(/(\d+)\s*(шт|штук|штуки|шт\.)/i);
      if (qm) qty = Number(qm[1]);

      const matches = [...cleanLine.matchAll(/\b(\d{4,7})\b/g)];
      if (matches.length > 0) {
        const last = matches[matches.length - 1];
        const price = Number(last[1]);
        let namePart = cleanLine.substring(0, last.index).replace(/[-—@]/g, ' ').trim();
        namePart = namePart.replace(/iPhone/gi, '').replace(/[()]/g, '').trim();
        namePart = namePart.toUpperCase().replace(/\s+/g, ' ');
        if (namePart.length > 2 && price > 0) list.push({ name: namePart, buyPrice: price, qty, custom: null, ...parseName(namePart) });
      }
    });
    return { list, deposit };
  }

  window.setView = function (v) {
    document.getElementById('viewShow').style.display = v === 'show' ? 'block' : 'none';
    document.getElementById('viewCmp').style.display = v === 'cmp' ? 'block' : 'none';
    document.getElementById('tabShow').classList.toggle('on', v === 'show');
    document.getElementById('tabCmp').classList.toggle('on', v === 'cmp');
  };

  function processText() {
    const text = document.getElementById('textInput').value;
    if (!text.trim()) return alert('Вставьте текст');
    const { list, deposit } = parseList(text);
    if (list.length === 0) return alert('Не найдено ни одной цены.');
    if (deposit) ad.s2 = deposit;
    items = sortList(list);
    showBoxes();
    renderPosters();
  }

  function showBoxes() {
    document.getElementById('markupBox').style.display = 'flex';
    document.getElementById('statsBox').style.display = 'flex';
  }

  window.applyMarkup = function () {
    currentMarkup = Number(document.getElementById('markupInput').value) || 0;
    renderPosters();
  };

  window.setTheme = function (k) {
    themeIdx = k;
    try { localStorage.setItem('fzTheme', k); } catch (e) {}
    renderPosters();
  };

  function updateStats() {
    let sum = 0, cnt = 0;
    items.forEach(it => { sum += finalPrice(it) * it.qty; cnt += it.qty; });
    document.getElementById('statCount').textContent = cnt + ' шт';
    document.getElementById('statTotal').textContent = fmt(sum) + ' ₽';
  }

  function uniqueModels() {
    const list = [];
    items.forEach(it => { if (!list.includes(it.model)) list.push(it.model); });
    return list;
  }

  function posterHTML(list, id, ed) {
    const t = THEMES[themeIdx];
    const models = uniqueModels();
    const mcol = m => t.pal[Math.max(0, models.indexOf(m)) % t.pal.length];
    const K = key => ed ? ` contenteditable="true" data-k="${key}"` : '';

    let h = `<div class="preview-container" id="${id}" style="background:${t.base};">
      <div class="poster" style="background:${t.pbg};color:${t.txt};">
      <div class="poster-brand" style="color:${t.brand};">FREE ZONE</div>
      <div class="poster-subtitle" style="color:${t.sub};">ЛУЧШИЕ ЦЕНЫ</div><div class="poster-list">`;

    let lastSim = null, lastModel = null;
    list.forEach(({ it, i }) => {
      if (it.sim !== lastSim) {
        const sc = t.sims[Math.max(0, SIM_ORDER.indexOf(it.sim))];
        h += `<div class="poster-section" style="color:${sc};background:${rgba(sc, .12)};border-color:${rgba(sc, .5)};">📲 iPhone • ${esc(it.sim)} 📱</div>`;
        lastSim = it.sim; lastModel = null;
      }
      const c = mcol(it.model);
      if (it.model !== lastModel) {
        h += `<div class="model-head"><div class="ln" style="background:${rgba(c, .5)};"></div><div class="lb" style="color:${c};">${esc(it.model.toUpperCase())}</div><div class="ln" style="background:${rgba(c, .5)};"></div></div>`;
        lastModel = it.model;
      }
      const q = it.qty > 1 ? `<span class="p-qty">${it.qty} шт</span>` : '';
      const pe = ed ? ` contenteditable="true" inputmode="numeric" data-i="${i}"` : '';
      h += `<div class="poster-item" style="background:${rgba(c, .10)};border-color:${rgba(c, .45)};">
        <div class="p-name" style="color:${t.txt};">${esc(it.name)} ${q}</div>
        <div class="p-price" style="color:${c};"><span${pe} class="price-edit${it.custom != null ? ' custom-price' : ''}">${fmt(finalPrice(it))}</span> ₽</div></div>`;
    });

    h += `</div><div class="poster-footer" style="background:${t.footBg};border-color:${t.footBr};">
        <div class="footer-title" style="color:${t.ft};"${K('t1')}>${esc(ad.t1)}</div>
        <div class="footer-sub" style="color:${t.muted};"${K('s1')}>${esc(ad.s1)}</div>
        <div class="footer-title" style="color:${t.ft};margin-top:8px;"${K('t2')}>${esc(ad.t2)}</div>
        <div class="footer-sub" style="color:${t.muted};"${K('s2')}>${esc(ad.s2)}</div>
        <div class="footer-label" style="color:${t.muted};"${K('s3')}>${esc(ad.s3)}</div>
        <div class="footer-phone" style="color:${t.phone};border-top-color:${t.footBr};"${K('phone')}>${esc(ad.phone)}</div>
      </div></div></div>`;
    return h;
  }

  function blocksPanelHTML() {
    blocks = [];
    let h = `<div class="blk-panel"><div class="blk-h">🖼 Картинки по блокам</div>
      <div class="blk-hint">Выберите блок — откроется отдельная картинка с текущими ценами и темой</div>`;
    const sims = [...new Set(items.map(i => i.sim))];
    sims.forEach(sim => {
      blocks.push({ sim, model: null, storage: null });
      h += `<div class="blk"><div class="blk-t">📲 ${esc(sim)}</div><div class="blk-b"><button class="chip main" onclick="saveBlock(${blocks.length - 1},event)">Весь блок ${esc(sim)}</button></div></div>`;
      const ms = [...new Set(items.filter(i => i.sim === sim).map(i => i.model))];
      ms.forEach(model => {
        blocks.push({ sim, model, storage: null });
        let btns = `<button class="chip main" onclick="saveBlock(${blocks.length - 1},event)">Вся модель</button>`;
        const sts = [...new Set(items.filter(i => i.sim === sim && i.model === model).map(i => i.storage))];
        sts.forEach(st => {
          blocks.push({ sim, model, storage: st });
          btns += `<button class="chip" onclick="saveBlock(${blocks.length - 1},event)">${esc(st || 'без памяти')}</button>`;
        });
        h += `<div class="blk"><div class="blk-t">${esc(model.toUpperCase())}<span>${esc(sim)}</span></div><div class="blk-b">${btns}</div></div>`;
      });
    });
    return h + '</div>';
  }

  function renderPosters() {
    const out = document.getElementById('postersOutput');
    if (items.length === 0) return;
    updateStats();
    const all = items.map((it, i) => ({ it, i }));
    out.innerHTML = `
      <div class="hint-row">
        <span>✏️ Нажмите на цену или на текст внизу, чтобы изменить</span>
        <button class="btn-reset" onclick="resetPrices()">↺ Сбросить цены</button>
      </div>
      <div class="themes">${THEMES.map((th, k) =>
        `<button class="theme-btn${k === themeIdx ? ' on' : ''}" onclick="setTheme(${k})"><span class="sw" style="background:${th.pbg}"></span>${th.name}</button>`).join('')}</div>
      ${posterHTML(all, 'poster_page_1', true)}
      <button class="btn btn-save-page" onclick="saveSingleImage(event)">📥 Нажми чтобы открыть фото</button>
      ${blocksPanelHTML()}`;
  }

  const out = document.getElementById('postersOutput');

  out.addEventListener('input', e => {
    const el = e.target;
    if (el.dataset.i !== undefined) {
      const digits = el.textContent.replace(/\D/g, '');
      items[el.dataset.i].custom = digits === '' ? null : Number(digits);
      updateStats();
    } else if (el.dataset.k) {
      ad[el.dataset.k] = el.textContent;
    }
  });

  out.addEventListener('focusin', e => {
    if (e.target.dataset && e.target.dataset.i !== undefined) {
      const r = document.createRange();
      r.selectNodeContents(e.target);
      const s = getSelection();
      s.removeAllRanges();
      s.addRange(r);
    }
  });

  out.addEventListener('focusout', e => {
    const el = e.target;
    if (el.dataset && el.dataset.i !== undefined) {
      const it = items[el.dataset.i];
      el.textContent = fmt(finalPrice(it));
      el.classList.toggle('custom-price', it.custom != null);
    }
  });

  out.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.isContentEditable) { e.preventDefault(); e.target.blur(); }
  });

  window.resetPrices = function () {
    items.forEach(it => it.custom = null);
    renderPosters();
  };

  function shot(el, done, btn) {
    const old = btn ? btn.innerHTML : '';
    if (btn) btn.innerHTML = '⏳';
    const win = window.open();
    html2canvas(el, { scale: 2, backgroundColor: THEMES[themeIdx].base, useCORS: true }).then(canvas => {
      if (!win) return alert('Разрешите всплывающие окна для этой страницы');
      win.document.write(`<body style="margin:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;">
        <p style="color:#fff;font-family:sans-serif;text-align:center;padding:10px;">Зажмите на картинку и выберите «Сохранить в Фото»</p>
        <img src="${canvas.toDataURL('image/png')}" style="width:100%;max-width:600px;display:block;" /></body>`);
    }).catch(() => {
      if (win) win.close();
      alert('Не удалось создать картинку');
    }).finally(() => {
      if (done) done();
      if (btn) btn.innerHTML = old;
    });
  }

  window.saveSingleImage = function (e) {
    if (document.activeElement) document.activeElement.blur();
    const el = document.getElementById('poster_page_1');
    if (el) shot(el, null, e.currentTarget);
  };

  window.saveBlock = function (k, e) {
    const b = blocks[k];
    if (!b) return;
    const list = items.map((it, i) => ({ it, i })).filter(({ it }) =>
      it.sim === b.sim && (b.model == null || it.model === b.model) && (b.storage == null || it.storage === b.storage));
    if (!list.length) return;
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;left:-10000px;top:0;width:390px;';
    wrap.innerHTML = posterHTML(list, 'blk_tmp', false);
    document.body.appendChild(wrap);
    shot(wrap.firstElementChild, () => wrap.remove(), e.currentTarget);
  };

  window.clearAll = function () {
    document.getElementById('textInput').value = '';
    ['markupBox', 'statsBox'].forEach(id => document.getElementById(id).style.display = 'none');
    document.getElementById('postersOutput').innerHTML = '<div style="text-align:center;padding:30px;color:#64748b;">Вставьте текст и нажмите "Рассчитать"</div>';
    items = [];
    ad = { ...defaultAd };
  };

  window.copyText = function () {
    if (items.length === 0) return alert('Сначала нажмите "Рассчитать"');
    const models = uniqueModels();
    let text = "📱 *ПРАЙС НА iPhone — FREE ZONE*\n";
    let lastSim = null, lastModel = null, lastStorage = null;
    items.forEach(it => {
      if (it.sim !== lastSim) {
        text += `\n . . . . . .   📲*iPhone • ${it.sim}*📱\n`;
        lastSim = it.sim; lastModel = null; lastStorage = null;
      }
      if (it.model !== lastModel) {
        const em = MODEL_EMOJI[models.indexOf(it.model) % MODEL_EMOJI.length];
        text += `\n . . . . . . . .   ${em} *${it.model.toUpperCase()}* ${em}\n`;
        lastModel = it.model; lastStorage = null;
      }
      if (it.storage !== lastStorage) {
        text += `▪️ ${it.model}${it.storage ? ' · ' + it.storage : ''}\n`;
        lastStorage = it.storage;
      }
      const q = it.qty > 1 ? ` (${it.qty} шт)` : '';
      const dot = it.color ? colorDot(it.color) + ' ' + it.color + ' — ' : '';
      text += `   ${dot}*${fmt(finalPrice(it))} ₽*${q}\n`;
    });
    text += `\n${ad.t1}\n${ad.s1}\n${ad.t2}\n${ad.s2}\n📞 ${ad.phone}`;
    navigator.clipboard.writeText(text).then(() => alert("Текст скопирован! Вставьте его в WhatsApp."));
  };

  const cmpKey = it => [it.sim, it.model.toUpperCase(), it.gb, it.color.toUpperCase()].join('|');

  window.runCompare = function () {
    const A = parseList(document.getElementById('cmpA').value).list;
    const B = parseList(document.getElementById('cmpB').value).list;
    if (!A.length && !B.length) return alert('Вставьте оба прайса');
    const map = new Map();
    const add = (list, side) => list.forEach(it => {
      const k = cmpKey(it);
      let r = map.get(k);
      if (!r) { r = { ...it, a: null, b: null }; map.set(k, r); }
      if (r[side] == null || it.buyPrice < r[side]) r[side] = it.buyPrice;
    });
    add(A, 'a'); add(B, 'b');
    cmpRows = sortList([...map.values()]);
    renderCompare();
  };

  function cmpCell(p, other) {
    if (p == null) return '<div class="cmp-cell none">—</div>';
    if (other == null || p === other) return `<div class="cmp-cell">${fmt(p)}</div>`;
    const d = fmt(Math.abs(p - other));
    return p < other
      ? `<div class="cmp-cell best">${fmt(p)}<small>−${d}</small></div>`
      : `<div class="cmp-cell worse">${fmt(p)}<small>+${d}</small></div>`;
  }

  function renderCompare() {
    const nA = esc(document.getElementById('nameA').value || 'Прайс 1');
    const nB = esc(document.getElementById('nameB').value || 'Прайс 2');
    let ca = 0, cb = 0, eq = 0, one = 0;
    cmpRows.forEach(r => {
      if (r.a == null || r.b == null) one++;
      else if (r.a < r.b) ca++;
      else if (r.a > r.b) cb++;
      else eq++;
    });

    let h = `<div class="cmp-sum">
      <div class="cmp-chip">Дешевле: ${nA}<b>${ca}</b></div>
      <div class="cmp-chip">Дешевле: ${nB}<b>${cb}</b></div>
      <div class="cmp-chip">Одинаково<b>${eq}</b></div>
      <div class="cmp-chip">Только в одном<b>${one}</b></div></div>
      <button class="btn btn-calc" style="width:100%;margin-bottom:14px;" onclick="cmpToShow()">✅ Лучшие цены → в витрину</button>
      <div class="cmp-head"><span>Позиция</span><span>${nA}</span><span>${nB}</span></div>`;

    let lastSim = null, lastModel = null;
    cmpRows.forEach(r => {
      if (r.sim !== lastSim) { h += `<div class="cmp-sec">📲 iPhone • ${esc(r.sim)}</div>`; lastSim = r.sim; lastModel = null; }
      if (r.model !== lastModel) { h += `<div class="cmp-mod">${esc(r.model.toUpperCase())}</div>`; lastModel = r.model; }
      h += `<div class="cmp-row"><div class="cmp-name">${esc(r.storage || '')} ${r.color ? colorDot(r.color) + ' ' + esc(r.color) : ''}</div>${cmpCell(r.a, r.b)}${cmpCell(r.b, r.a)}</div>`;
    });
    document.getElementById('cmpOutput').innerHTML = h;
  }

  window.cmpToShow = function () {
    if (!cmpRows.length) return;
    items = sortList(cmpRows.map(r => {
      const p = Math.min(...[r.a, r.b].filter(x => x != null));
      const tag = r.sim === 'SIM + eSIM' ? '1SIM+ESIM' : r.sim === 'SIM' ? 'SIM' : 'ESIM';
      const name = `${r.model.toUpperCase()} ${r.raw} ${r.color.toUpperCase()} ${tag}`.replace(/\s+/g, ' ').trim();
      return { name, buyPrice: p, qty: 1, custom: null, ...parseName(name) };
    }));
    showBoxes();
    setView('show');
    renderPosters();
    window.scrollTo(0, 0);
  };

  window.clearCompare = function () {
    document.getElementById('cmpA').value = '';
    document.getElementById('cmpB').value = '';
    document.getElementById('cmpOutput').innerHTML = '';
    cmpRows = [];
  };

  window.onload = function () {
    document.getElementById('postersOutput').innerHTML = '<div style="text-align:center;padding:30px;color:#64748b;">Вставьте текст и нажмите "Рассчитать"</div>';
  };
</script>
</body>
</html>
