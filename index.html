<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FREE ZONE - Прайс</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  body { background-color: #0f0f13; color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; margin: 0; padding-bottom: 80px;}
  .container { max-width: 500px; margin: 0 auto; }
  
  /* Панель управления */
  .controls { background: #1a1a20; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #333; }
  textarea { width: 100%; height: 120px; background: #0f0f13; color: white; border: 1px solid #444; border-radius: 8px; padding: 10px; box-sizing: border-box; font-family: monospace; font-size: 12px; margin-bottom: 10px; }
  
  .btn-group { display: flex; gap: 10px; margin-bottom: 10px; }
  .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; display: inline-block;}
  .btn-green { background: #00ff88; color: #000; }
  .btn-red { background: #e6194b; color: white; }
  .btn-blue { background: #007aff; color: white; }
  .btn-grey { background: #444; color: white; }
  
  /* Каталог */
  .header-text { color: #e0a800; font-size: 14px; font-weight: bold; margin-bottom: 15px; text-transform: uppercase; text-align: center;}
  
  .card { 
    background: #1a1a20; border-radius: 10px; padding: 12px 15px; margin-bottom: 10px; 
    border: 1px solid #2a2a35;
  }
  .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;}
  .info { flex: 1; padding-right: 10px; }
  .title { font-weight: bold; font-size: 15px; margin-bottom: 2px; }
  .desc { color: #888; font-size: 12px; }
  
  .price { font-size: 18px; font-weight: bold; color: #fff; white-space: nowrap;}
  
  /* Поле ручной наценки в карточке */
  .manual-markup { display: flex; align-items: center; gap: 5px; margin-top: 8px; background: #0f0f13; padding: 5px 10px; border-radius: 6px; border: 1px solid #333;}
  .manual-markup span { font-size: 12px; color: #aaa; }
  .manual-markup input { width: 60px; background: transparent; border: none; color: #00ff88; font-size: 14px; font-weight: bold; outline: none; text-align: center;}
  
  .footer { background: #1a1a20; border: 1px solid #4a3a1a; border-radius: 12px; padding: 15px; margin-top: 20px; text-align: center; }
  .footer h4 { color: #e0a800; margin: 0 0 5px 0; font-size: 14px;}
  .footer p { font-size: 12px; color: #ccc; margin: 5px 0 10px 0; }
  .phone { color: #00ff88; font-size: 18px; font-weight: bold; text-decoration: none; }
  
  /* Скрываем элементы управления при создании скриншота */
  .hide-on-capture { display: none !important; }
</style>
</head>
<body>

<div class="container">
  
  <!-- Панель управления (не попадет на скриншот) -->
  <div class="controls" id="admin-controls">
    <textarea id="input-text" placeholder="Вставьте список сюда (Например: 🇮🇩A57 8/256 Grey 33000)"></textarea>
    
    <div class="btn-group">
      <button class="btn btn-green" onclick="processList()">Рассчитать</button>
      <button class="btn btn-grey" onclick="clearList()">Очистить</button>
    </div>
    
    <div class="btn-group">
      <button class="btn btn-red" onclick="downloadImage()">📥 Скачать картинку</button>
      <button class="btn btn-blue" onclick="sendToWhatsApp()">📲 Отправить текст в WhatsApp</button>
    </div>
  </div>

  <!-- Область для скриншота и просмотра -->
  <div id="capture-area">
    <div class="header-text">
      ПРЕДЗАКАЗ ДО 17:00<br>ВЫДАЧА НА СУББОТУ
    </div>

    <div id="result-list">
      <div style="text-align:center; color:#666; padding: 20px;">Вставьте текст и нажмите "Рассчитать"</div>
    </div>

    <div class="footer">
      <h4>💳 Доступна рассрочка</h4>
      <p>Без банков и переплат</p>
      <h4>🔥 Предзаказ ВЫГОДНЕЕ!</h4>
      <p>Аванс всего 3000 ₽. Экономьте!</p>
      <hr style="border-color: #333; margin: 10px 0;">
      <p>Заказ по телефону / WhatsApp:</p>
      <a href="tel:+79887836677" class="phone">+7 988 783-66-77</a>
    </div>
  </div>

</div>

<script>
  let currentData = []; // Здесь храним рассчитанные данные

  function clearList() {
    document.getElementById('input-text').value = '';
    document.getElementById('result-list').innerHTML = '<div style="text-align:center; color:#666; padding: 20px;">Вставьте текст и нажмите "Рассчитать"</div>';
    currentData = [];
  }

  function processList() {
    const rawText = document.getElementById('input-text').value;
    
    if (!rawText.trim()) {
      alert("Сначала вставьте список!");
      return;
    }

    const lines = rawText.split('\n');
    currentData = [];
    
    lines.forEach(line => {
      line = line.trim();
      if (!line || line.includes('ПРЕДЗАКАЗ') || line.includes('ВЫДАЧА НА')) return;

      // Ищем цену в конце строки
      const priceMatch = line.match(/^(.*?)\s+(\d+)$/);
      if (priceMatch) {
        const name = priceMatch[1].trim();
        const originalPrice = parseInt(priceMatch[2]);
        
        currentData.push({ 
            name: name, 
            originalPrice: originalPrice,
            manualMarkup: 0 // Наценка по умолчанию 0
        });
      }
    });
    
    renderList();
  }

  function renderList() {
    const container = document.getElementById('result-list');
    if (currentData.length === 0) return;

    let html = '';
    const formatPrice = (num) => num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");

    currentData.forEach((item, index) => {
        const finalPrice = item.originalPrice + item.manualMarkup;

        // Разбиваем на модель и характеристики для красоты
        let title = item.name;
        let desc = "";
        const specMatch = item.name.match(/(.*?)\s+(\d+\/\d+.*)/);
        if (specMatch) {
            title = specMatch[1];
            desc = specMatch[2];
        }

        html += `
          <div class="card">
            <div class="card-top">
              <div class="info">
                <div class="title">${title}</div>
                <div class="desc">${desc}</div>
              </div>
              <div class="price">${formatPrice(finalPrice)} ₽</div>
            </div>
            
            <!-- Поле для ручной наценки (скроется на картинке) -->
            <div class="manual-markup hide-on-capture">
                <span>Наценка: +</span>
                <input type="number" value="${item.manualMarkup}" onchange="updateMarkup(${index}, this.value)"> ₽
            </div>
          </div>
        `;
    });
    container.innerHTML = html;
  }

  // Обновление наценки для конкретного товара
  function updateMarkup(index, value) {
    currentData[index].manualMarkup = parseInt(value) || 0;
    renderList(); // Перерисовываем, чтобы обновить итоговую цену
  }

  function downloadImage() {
    if (currentData.length === 0) return alert("Нет данных для картинки");
    
    const captureArea = document.getElementById('capture-area');
    
    // Временно скрываем поля ввода наценки
    document.querySelectorAll('.hide-on-capture').forEach(el => el.style.display = 'none');

    html2canvas(captureArea, {
        scale: 2, 
        backgroundColor: "#0f0f13",
        useCORS: true
    }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'prays.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        
        // Возвращаем поля ввода обратно
        document.querySelectorAll('.hide-on-capture').forEach(el => el.style.display = 'flex');
    });
  }

  function sendToWhatsApp() {
    if (currentData.length === 0) return alert("Нет данных для отправки");

    const formatPrice = (num) => num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    
    let message = "ПРЕДЗАКАЗ ДО 17:00\nВЫДАЧА НА СУББОТУ\n\n";
    
    currentData.forEach(item => {
        const finalPrice = item.originalPrice + item.manualMarkup;
        message += `${item.name} ${formatPrice(finalPrice)}\n`;
    });

    message += "\n💳 Доступна рассрочка\n🔥 Предзаказ ВЫГОДНЕЕ!\nАванс всего 3000 ₽.\n\nЗаказ по телефону / WhatsApp:\n+7 988 783-66-77";

    // Открываем WhatsApp с готовым текстом
    window.open(`https://wa.me/?text=${encodeURIComponent(message)}`, '_blank');
  }
</script>

</body>
</html>
