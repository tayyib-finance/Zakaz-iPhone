<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FREE ZONE</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  body { background-color: #0f0f13; color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; margin: 0; padding-bottom: 80px;}
  .container { max-width: 500px; margin: 0 auto; }
  
  /* Админка */
  .admin-panel { background: #1a1a20; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #333; }
  .tabs { display: flex; gap: 5px; margin-bottom: 10px; }
  .tab-btn { flex: 1; padding: 8px; background: #2a2a35; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px;}
  .tab-btn.active { background: #007aff; font-weight: bold;}
  textarea { width: 100%; height: 100px; background: #0f0f13; color: white; border: 1px solid #444; border-radius: 8px; padding: 10px; box-sizing: border-box; font-family: monospace; font-size: 13px; margin-bottom: 10px; }
  .input-group { display: flex; gap: 10px; margin-bottom: 10px; }
  .input-group input { flex: 1; background: #0f0f13; color: white; border: 1px solid #444; border-radius: 8px; padding: 10px; font-size: 16px; }
  .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-bottom: 8px;}
  .btn-green { background: #00ff88; color: #000; }
  .btn-red { background: #e6194b; color: white; }
  .btn-blue { background: #007aff; color: white; }
  
  /* Каталог */
  .header-text { color: #e0a800; font-size: 14px; font-weight: bold; margin-bottom: 15px; text-transform: uppercase; text-align: center;}
  
  .card { 
    background: #1a1a20; border-radius: 10px; padding: 15px; margin-bottom: 10px; 
    display: flex; justify-content: space-between; align-items: center; border: 1px solid #2a2a35;
  }
  .card.best { border-color: #00ff88; }
  .info { flex: 1; padding-right: 10px; }
  .title { font-weight: bold; font-size: 15px; margin-bottom: 4px; }
  .desc { color: #888; font-size: 12px; }
  
  .price-block { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 8px;}
  .price { font-size: 16px; font-weight: bold; color: #fff; white-space: nowrap;}
  .price.best-price { color: #00ff88; }
  .btn-add { background: #007aff; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; }
  .btn-add.added { background: #00ff88; color: #000; }

  /* Корзина */
  .cart-bar { 
    position: fixed; bottom: 0; left: 0; right: 0; background: #1a1a20; border-top: 1px solid #333; 
    padding: 15px; display: none; justify-content: space-between; align-items: center;
    box-shadow: 0 -5px 15px rgba(0,0,0,0.5); z-index: 100;
  }
  .cart-bar.show { display: flex; }
  .cart-info { font-size: 14px; }
  .cart-total { font-size: 18px; font-weight: bold; color: #00ff88; }
  .btn-checkout { background: #e6194b; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; }

  .footer { background: #1a1a20; border: 1px solid #4a3a1a; border-radius: 12px; padding: 15px; margin-top: 20px; text-align: center; }
  .footer h4 { color: #e0a800; margin: 0 0 5px 0; font-size: 14px;}
  .footer p { font-size: 12px; color: #ccc; margin: 5px 0 10px 0; }
  .phone { color: #00ff88; font-size: 18px; font-weight: bold; text-decoration: none; }

  .admin-only { display: none; }
  body.is-admin .admin-only { display: block; }
  body.is-client .btn-add { display: block; }
  body.is-client .btn-add { display: none; }
</style>
</head>
<body>

<div class="container">
  
  <!-- Кнопка переключения режимов -->
  <button class="btn btn-blue admin-only" onclick="toggleMode()" style="margin-bottom: 15px;">🔄 Переключить режим (Админ / Клиент)</button>

  <!-- ПАНЕЛЬ АДМИНА -->
  <div class="admin-panel admin-only" id="admin-panel">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab(1)">Поставщик 1</button>
      <button class="tab-btn" onclick="switchTab(2)">Поставщик 2</button>
      <button class="tab-btn" onclick="switchTab(3)">Поставщик 3</button>
    </div>
    
    <textarea id="input-text" placeholder="Вставьте список сюда..."></textarea>
    <div class="input-group">
      <input type="number" id="markup-val" placeholder="Наценка" value="0">
      <select id="markup-type" style="background:#0f0f13; color:white; border:1px solid #444; border-radius:8px; padding:10px; font-size:16px;">
        <option value="rub">₽</option>
        <option value="percent">%</option>
      </select>
    </div>
    <button class="btn btn-green" onclick="saveAdminData()">💾 Сохранить и Применить наценку</button>
    <button class="btn btn-red" id="btn-download" onclick="downloadImage()" style="display:none;">📥 Скачать картинку</button>
  </div>

  <!-- КАТАЛОГ -->
  <div id="catalog-area">
    <div class="header-text">
      ПРЕДЗАКАЗ ДО 17:00<br>ВЫДАЧА НА СУББОТУ
    </div>

    <div id="result-list">
      <div style="text-align:center; color:#666; padding: 20px;">Загрузка...</div>
    </div>

    <div class="footer">
      <h4>💳 Доступна рассрочка</h4>
      <p>Без банков и переплат</p>
      <h4>🔥 Предзаказ ВЫГОДНЕЕ!</h4>
      <p>Аванс всего 3000 ₽. Экономьте!</p>
      <hr style="border-color: #333; margin: 10px 0;">
      <p>Заказ по телефону / WhatsApp:</p>
      <a href="tel:+79887836677" class="phone">+7 988 783-66-77</a>
    </div>
  </div>

</div>

<!-- КОРЗИНА -->
<div class="cart-bar" id="cart-bar">
  <div class="cart-info">Товаров: <span id="cart-count">0</span><br><span class="cart-total" id="cart-total">0 ₽</span></div>
  <button class="btn-checkout" onclick="checkout()">Оформить заказ</button>
</div>

<script>
  let cart = [];
  let supplierData = { 1: [], 2: [], 3: [] }; // Сырые данные поставщиков
  let currentTab = 1;
  let isAdminMode = false; // По умолчанию открывается для клиента

  // Инициализация при загрузке
  window.onload = function() {
    // Восстанавливаем данные из памяти браузера (если вы их сохраняли)
    const saved = localStorage.getItem('freezone_data');
    if (saved) supplierData = JSON.parse(saved);

    // Проверяем ссылку: если в ней есть ?admin=1, включаем режим админа
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('admin') === '1') {
      isAdminMode = true;
      document.body.classList.add('is-admin');
    } else {
      document.body.classList.add('is-client');
    }
    
    // Загружаем первый таб в админку
    if (isAdminMode) {
      document.getElementById('input-text').value = supplierData[1].map(i => i.raw).join('\n');
    }
    
    processData();
  };

  function toggleMode() {
    isAdminMode = !isAdminMode;
    document.body.classList.toggle('is-admin', isAdminMode);
    document.body.classList.toggle('is-client', !isAdminMode);
    processData();
  }

  function switchTab(tabNum) {
    currentTab = tabNum;
    document.querySelectorAll('.tab-btn').forEach((btn, index) => {
      if (index + 1 === tabNum) btn.classList.add('active');
      else btn.classList.remove('active');
    });
    document.getElementById('input-text').value = supplierData[tabNum].map(i => i.raw).join('\n');
    processData();
  }

  function parseInput(text) {
    let parsed = [];
    text.split('\n').forEach(line => {
      line = line.trim();
      if (!line) return;
      
      // Убираем дублирующиеся заголовки "ПРЕДЗАКАЗ" и т.д.
      if (line.includes('ПРЕДЗАКАЗ') || line.includes('ВЫДАЧА НА')) return;

      const priceMatch = line.match(/^(.*?)\s+(\d+)$/);
      if (priceMatch) {
        parsed.push({ raw: line, name: priceMatch[1].trim(), price: parseInt(priceMatch[2]) });
      } else {
        parsed.push({ raw: line, isHeader: true });
      }
    });
    return parsed;
  }

  // Сохранение данных Админом
  function saveAdminData() {
    const rawText = document.getElementById('input-text').value;
    supplierData[currentTab] = parseInput(rawText);
    
    // Сохраняем в память телефона (браузера)
    localStorage.setItem('freezone_data', JSON.stringify(supplierData));
    
    alert("Данные сохранены! Наценка применена.");
    document.getElementById('btn-download').style.display = 'block';
    processData();
  }

  function processData() {
    const markupVal = parseFloat(document.getElementById('markup-val').value) || 0;
    const markupType = document.getElementById('markup-type').value;
    
    // Собираем все товары со всех 3 поставщиков для поиска лучшей цены
    let allProducts = {};
    for (let i = 1; i <= 3; i++) {
        supplierData[i].forEach(item => {
            if (item.isHeader) return;
            const key = item.name.toLowerCase();
            if (!allProducts[key]) allProducts[key] = { name: item.name, bestPrice: Infinity, bestSupplier: null };
            if (item.price < allProducts[key].bestPrice) {
                allProducts[key].bestPrice = item.price;
                allProducts[key].bestSupplier = i;
            }
        });
    }

    let htmlResult = '';
    const formatPrice = (num) => num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");

    // Если мы в режиме Админа, показываем только выбранного поставщика. 
    // Если в режиме Клиента, показываем только Поставщика 1 (или того, кого выберете для клиента).
    const dataToShow = isAdminMode ? supplierData[currentTab] : supplierData[1];

    if (dataToShow.length === 0) {
      document.getElementById('result-list').innerHTML = '<div style="text-align:center; color:#666; padding: 20px;">Список пуст. Добавьте товары в режиме Админа.</div>';
      return;
    }

    dataToShow.forEach(item => {
        if (item.isHeader) {
            htmlResult += `<div class="header-text" style="margin-top:15px; text-align:left;">${item.raw}</div>`;
            return;
        }

        // Считаем финальную цену с наценкой
        let finalPrice = item.price;
        if (markupType === 'rub') finalPrice += markupVal;
        else finalPrice = Math.round(item.price * (1 + markupVal / 100));

        // Проверяем лучшая ли это цена
        const key = item.name.toLowerCase();
        const isBest = allProducts[key] && allProducts[key].bestSupplier === (isAdminMode ? currentTab : 1);

        let title = item.name;
        let desc = "";
        const specMatch = item.name.match(/(.*?)\s+(\d+\/\d+.*)/);
        if (specMatch) {
            title = specMatch[1];
            desc = specMatch[2];
        }

        // Проверяем корзину
        const inCart = cart.some(c => c.name === item.name);
        const btnClass = inCart ? 'btn-add added' : 'btn-add';
        const btnText = inCart ? '✓ В корзине' : 'Купить';

        htmlResult += `
          <div class="card ${isBest && isAdminMode ? 'best' : ''}">
            <div class="info">
              <div class="title">${title}</div>
              <div class="desc">${desc}</div>
            </div>
            <div class="price-block">
              <span class="price ${isBest && isAdminMode ? 'best-price' : ''}">${formatPrice(finalPrice)} ₽</span>
              ${!isAdminMode ? `<button class="${btnClass}" onclick="toggleCart('${item.name.replace(/'/g, "\\'")}', ${finalPrice})">${btnText}</button>` : ''}
            </div>
          </div>
        `;
    });
    
    document.getElementById('result-list').innerHTML = htmlResult;
  }

  function toggleCart(name, price) {
    const existingIndex = cart.findIndex(c => c.name === name);
    if (existingIndex > -1) cart.splice(existingIndex, 1);
    else cart.push({ name: name, price: price });
    
    updateCartUI();
    processData();
  }

  function updateCartUI() {
    const bar = document.getElementById('cart-bar');
    if (cart.length > 0) {
      bar.classList.add('show');
      document.getElementById('cart-count').innerText = cart.length;
      document.getElementById('cart-total').innerText = cart.reduce((sum, item) => sum + item.price, 0).toLocaleString('ru-RU') + ' ₽';
    } else {
      bar.classList.remove('show');
    }
  }

  function checkout() {
    if (cart.length === 0) return;
    let message = "🔥 *НОВЫЙ ЗАКАЗ С САЙТА* 🔥\n\n";
    let total = 0;
    cart.forEach((item, i) => {
      message += `${i+1}. ${item.name} — ${item.price.toLocaleString('ru-RU')} ₽\n`;
      total += item.price;
    });
    message += `\n💰 *ИТОГО: ${total.toLocaleString('ru-RU')} ₽*\n\n`;
    window.open(`https://wa.me/79887836677?text=${encodeURIComponent(message)}`, '_blank');
  }

  function downloadImage() {
    html2canvas(document.getElementById('catalog-area'), { scale: 2, backgroundColor: "#0f0f13" }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'prays.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    });
  }
</script>

</body>
</html>
